<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversation summary</title>
    <style>
      /* Honour Thunderbird's light/dark theme and UI font (mirrors organiseConfirm.html). */
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --fg: CanvasText;
        --muted: GrayText;
        --field-bg: Field;
        --field-fg: FieldText;
        --border: color-mix(in srgb, CanvasText 22%, transparent);
        --accent: AccentColor;
        --accent-fg: AccentColorText;
        --accent-hover: color-mix(in srgb, AccentColor 80%, black);
        --accent-soft: color-mix(in srgb, AccentColor 14%, Canvas);
        --subtle-bg: color-mix(in srgb, CanvasText 6%, Canvas);
        --hover-bg: color-mix(in srgb, CanvasText 12%, Canvas);
      }
      html,
      body {
        height: 100%;
      }
      body {
        font: message-box;
        margin: 0;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }
      /* Scrollable content; the footer with the actions stays pinned at the bottom. */
      main {
        flex: 1 1 0;
        overflow-y: auto;
        padding: 16px 16px 8px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px;
      }
      h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 18px 0 8px;
      }
      #summary-text {
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        margin: 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--subtle-bg);
      }
      #status {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }
      .point {
        margin: 0 0 14px;
        padding: 0;
        border: none;
      }
      .point legend {
        padding: 0;
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
      }
      .point-hint {
        font-weight: normal;
        color: var(--muted);
        margin-left: 4px;
      }
      /* Options rendered as a selectable list: the whole row is the click target. */
      .options {
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
      }
      .option:last-child {
        border-bottom: none;
      }
      .option:hover {
        background: var(--hover-bg);
      }
      .option:has(input:checked) {
        background: var(--accent-soft);
      }
      .option input {
        margin: 0;
        accent-color: var(--accent);
      }
      textarea,
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--field-bg);
        color: var(--field-fg);
        font: inherit;
        font-size: 13px;
      }
      textarea {
        resize: vertical;
        min-height: 54px;
      }
      .note {
        margin-top: 6px;
      }
      .footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
      }
      .footer .spacer {
        flex: 1 1 auto;
      }
      .footer-hint {
        font-size: 12px;
        color: var(--muted);
      }
      .footer button {
        padding: 6px 16px;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      .btn-primary {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-fg);
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn-secondary {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
      }
      .btn-secondary:hover {
        background: var(--hover-bg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Conversation summary</h1>
      <p id="status">Loading…</p>
      <p id="summary-text" hidden></p>
      <section id="points-section" hidden>
        <h2>Open points</h2>
        <form id="points"></form>
      </section>
      <section id="extra-section" hidden>
        <h2>Anything else to include?</h2>
        <textarea id="extra" rows="3" placeholder="Optional instructions for the reply"></textarea>
      </section>
    </main>
    <div class="footer">
      <span class="footer-hint">Ctrl+Enter to write</span>
      <span class="spacer"></span>
      <button type="button" id="close-btn" class="btn-secondary">Close</button>
      <button type="button" id="write-btn" class="btn-primary" disabled>Write answer</button>
    </div>
    <script src="../summary.js"></script>
  </body>
</html>
