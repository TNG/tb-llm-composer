<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings Page</title>
    <style>
      /*
       * Honour Thunderbird's light/dark theme and UI font:
       * - color-scheme + CSS system colors (Canvas/CanvasText/Field/AccentColor…) auto-adapt to the theme.
       * - `font: message-box` inherits Thunderbird's UI font family and size.
       */
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --fg: CanvasText;
        --muted: GrayText;
        --field-bg: Field;
        --field-fg: FieldText;
        --border: color-mix(in srgb, CanvasText 22%, transparent);
        --accent: AccentColor;
        --accent-fg: AccentColorText;
        --accent-hover: color-mix(in srgb, AccentColor 80%, black);
        --subtle-bg: color-mix(in srgb, CanvasText 6%, Canvas);
      }

      body {
        font: message-box;
        color: var(--fg);
        background: var(--bg);
        /* No default UA margin: it overflows Thunderbird's embedded options frame and adds a second scrollbar. */
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
      }

      .settings-section {
        margin-bottom: 20px;
      }

      .settings-section h2 {
        border-bottom: 1px solid var(--border);
        padding-bottom: 5px;
      }

      .form-group {
        margin-bottom: 10px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
      }

      .form-group input[type="text"],
      .form-group input[type="password"],
      .form-group input[type="number"],
      .form-group select {
        width: 90%;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--field-bg);
        color: var(--field-fg);
        font: inherit;
      }

      .form-group input[type="checkbox"] {
        margin-right: 5px;
      }

      /* Checkbox + its label sit on one line, vertically centred. */
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .checkbox-row input[type="checkbox"] {
        margin: 0;
      }

      .checkbox-row label {
        display: inline;
        margin-bottom: 0;
      }

      /* Compact numeric input sitting inline in a checkbox row (e.g. "recent mails" count). */
      .checkbox-row input[type="number"] {
        flex: 0 0 auto;
        width: 4.5em;
        padding: 4px 6px;
      }

      /* Single-line fields: label on the left, control filling the rest of the row. */
      .form-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      .form-row > label {
        flex: 0 0 auto;
        width: 200px;
        margin-bottom: 0;
      }

      .form-row > input {
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
      }

      /* Token field: input + an eye toggle docked in its right edge to reveal the obscured value. */
      .input-with-toggle {
        flex: 1 1 auto;
        min-width: 0;
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-with-toggle input {
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
        /* Leave room so the value never runs under the eye button. */
        padding-right: 38px;
      }

      .input-toggle-btn {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--muted, GrayText);
        cursor: pointer;
      }

      .input-toggle-btn:hover {
        color: var(--fg, CanvasText);
      }

      .input-toggle-btn svg {
        width: 18px;
        height: 18px;
        display: block;
      }

      /* Show the "hide" (eye-off) glyph only while the token is revealed. */
      .input-toggle-btn .icon-eye-off {
        display: none;
      }

      .input-toggle-btn.revealed .icon-eye {
        display: none;
      }

      .input-toggle-btn.revealed .icon-eye-off {
        display: block;
      }

      /*
       * "URL:" + Grant access + status occupy the label column (so the input lines up with the
       * fields below). push-right on the button keeps the empty space between "URL:" and the controls.
       */
      .url-label-group {
        flex: 0 0 200px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .url-label-group label {
        margin-bottom: 0;
      }

      /* All buttons share one look: the grant-access (accent) color and a uniform size. */
      button {
        padding: 6px 12px;
        background-color: var(--accent);
        color: var(--accent-fg);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        margin-bottom: 0;
      }

      button:hover {
        background-color: var(--accent-hover);
      }

      /* Compact variant for the delete button inside a dense rule row. */
      .remove-rule-btn {
        padding: 4px 10px;
      }

      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--field-bg);
        color: var(--field-fg);
        font: inherit;
        /* No resize grip in the corner. */
        resize: none;
      }

      #llm_context {
        height: 9.5em;
      }

      #other_options,
      #subject_context,
      .fe-other-options {
        height: 5em;
      }

      #summary_context,
      #organise_system_prompt {
        height: 7em;
      }

      #report_system_prompt {
        height: 14em;
      }

      /* Advanced-only controls are hidden until "Show advanced options" is checked. */
      body:not(.show-advanced) .advanced-only {
        display: none;
      }

      /* Top-of-page toggle, visually separated from the first section. */
      .advanced-toggle {
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      /* Per-feature endpoint block; its fields only show while the override is enabled. */
      .feature-endpoint {
        margin-top: 10px;
      }

      .fe-fields {
        margin-top: 8px;
        padding-left: 12px;
        border-left: 2px solid var(--border);
      }

      .feature-endpoint:not(.enabled) .fe-fields {
        display: none;
      }

      /* Round info badge: a bordered "i" that inherits the theme's text color and scales with the font. */
      .info-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.25em;
        height: 1.25em;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 0.75em;
        font-style: italic;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1;
        flex: 0 0 auto;
        cursor: help;
        color: var(--fg);
        user-select: none;
      }

      /*
       * Any label hosting an info badge (and, in the context sections, a reset icon beside it)
       * lays its contents out as a centred flex row. This keeps the "i" badge vertically centred
       * on the text line and aligned with the reset icons — which are themselves flex-centred —
       * so every icon lines up consistently regardless of the surrounding row.
       */
      label:has(.info-icon) {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
      }

      /* Label with a trailing action (e.g. a reset-to-default icon button) on the same line. */
      .label-with-action {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
      }

      .label-with-action label {
        margin-bottom: 0;
      }

      /* Icon-only reset button: neutral, transparent until hover (like the token eye toggle). */
      .reset-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 4px;
        color: var(--muted, GrayText);
        cursor: pointer;
      }

      .reset-btn:hover {
        background: var(--subtle-bg);
        color: var(--fg, CanvasText);
      }

      .reset-btn svg {
        width: 16px;
        height: 16px;
        display: block;
      }

      .folder-path-badge {
        font-size: 16px;
        flex: 0 0 auto;
        cursor: default;
      }

      /* A button plus its status message on one line (e.g. "Show available folder paths"). */
      .inline-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Push this item (and everything after it) to the right end of a flex row. */
      .push-right {
        margin-left: auto;
      }

      .folder-rule-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }

      .folder-rule-row input,
      .folder-rule-row select {
        flex: 1;
        min-width: 0;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--field-bg);
        color: var(--field-fg);
        font: inherit;
      }

      .folder-rule-row .description-input {
        flex: 2;
      }

      /* Neutral black/white delete button (adapts to the theme) rather than a coloured one. */
      .remove-rule-btn {
        background-color: transparent;
        color: var(--fg);
      }

      .remove-rule-btn:hover {
        background-color: var(--subtle-bg);
      }

      .folder-rule-header {
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--muted);
      }

      .folder-rule-header span:first-child { flex: 1; }
      .folder-rule-header span:last-child { flex: 2; }

      /* Pre-filter rows: field / operator / value / target folder / badge / remove. */
      .prefilter-rule-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        align-items: center;
      }

      .prefilter-rule-row input,
      .prefilter-rule-row select {
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--field-bg);
        color: var(--field-fg);
        font: inherit;
        min-width: 0;
      }

      .prefilter-rule-header {
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--muted);
      }

      /* Column widths shared by the header and the rows. */
      .prefilter-rule-row .pf-field,   .prefilter-rule-header .pf-field   { flex: 0 0 110px; }
      .prefilter-rule-row .pf-operator,.prefilter-rule-header .pf-operator{ flex: 0 0 170px; }
      .prefilter-rule-row .pf-value,   .prefilter-rule-header .pf-value   { flex: 2; }
      .prefilter-rule-row .pf-target,  .prefilter-rule-header .pf-target  { flex: 2; }
      .prefilter-rule-header .pf-badge { flex: 0 0 16px; }

      /* Sub-heading inside a settings section (e.g. "Pre-filter rules"). */
      .settings-section h3 {
        font-size: 14px;
        margin: 18px 0 6px;
      }

      @-webkit-keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 30px;
          opacity: 1;
        }
      }

      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 30px;
          opacity: 1;
        }
      }

      @-webkit-keyframes fadeout {
        from {
          bottom: 30px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }

      @keyframes fadeout {
        from {
          bottom: 30px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }

      /* "Other options" label, the query-models button, and its status share one row. */
      .other-options-header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 5px;
      }

      .other-options-header label {
        margin-bottom: 0;
      }


      .models-status {
        font-size: 12px;
        color: var(--muted);
      }

      /* Sits under the URL input, aligned with it (label column is 200px + 8px gap). */
      .url-hint {
        display: block;
        margin: -6px 0 10px 208px;
        overflow-wrap: anywhere;
      }

      /*
       * Discovered models / available folder paths. Each row is itself the clickable control
       * (applies the model, or copies the path) — it highlights on hover/focus.
       */
      .model-list {
        margin-top: 6px;
        max-height: 200px;
        overflow-y: auto;
      }

      .model-list:empty {
        display: none;
      }

      .model-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
      }

      .model-row:hover,
      .model-row:focus-visible {
        background: var(--subtle-bg);
        outline: none;
      }

      .model-row .model-id {
        flex: 1 1 auto;
        overflow-wrap: anywhere;
        font-family: monospace;
      }

      /* Transient "Copied!" confirmation shown at the end of a folder row after clicking. */
      .copied-flag {
        flex: 0 0 auto;
        font-size: 12px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="settings-container">
      <form id="settingsForm">
        <div class="form-group checkbox-row advanced-toggle">
          <input type="checkbox" id="show_advanced_options" name="show advanced options" />
          <label for="show_advanced_options">
            Show advanced options
            <span class="info-icon" title="Edit the system prompts of every feature and give Compose, Summarize, Reports and Organise Folder their own endpoint and options.&#10;&#10;Advanced settings only apply while this is checked; otherwise every feature uses the API settings below and the default prompts.">i</span>
          </label>
        </div>

        <div class="settings-section">
          <h2>API</h2>
          <p class="advanced-only models-status">
            Default endpoint. A feature uses it unless a separate endpoint is enabled in its own section below.
          </p>
          <div class="form-group form-row">
            <div class="url-label-group">
              <label for="url">URL:</label>
              <button type="button" id="grant-access-btn" class="push-right">Grant access</button>
              <span id="url-permission-status" class="folder-path-badge"></span>
            </div>
            <input type="text" id="url" name="URL" placeholder="https://your-llm.example.com/v1" />
          </div>
          <!-- Shows the chat route we actually call, since the field also accepts the plain API base. -->
          <div id="url-resolved-hint" class="models-status url-hint"></div>
          <div class="form-group form-row">
            <label for="api_token">Api token:</label>
            <div class="input-with-toggle">
              <input type="password" id="api_token" name="api token" autocomplete="off" spellcheck="false" />
              <button type="button" id="toggle-token-btn" class="input-toggle-btn" title="Show token" aria-label="Show token" aria-pressed="false">
                <!-- Eye (token hidden) -->
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <!-- Eye-off (token shown) -->
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>
          <div class="form-group form-row">
            <label for="timeout">
              Request timeout (seconds):
              <span class="info-icon" title="Timeout for API requests in seconds. Leave empty or set to 0 for no timeout.">i</span>
            </label>
            <input type="number" id="timeout" name="timeout" min="0" step="1" placeholder="No timeout" />
          </div>
          <div class="form-group form-row">
            <label for="context_window">Context window:</label>
            <input type="number" id="context_window" name="context window" min="1"/>
          </div>
          <div class="form-group">
            <div class="other-options-header">
              <label for="other_options">
                Other options (json):
                <span class="info-icon" title="These are options added as 'params' in the request body when calling the LLM endpoint configured above. See the documentation of that endpoint for available options. 'params.messages' is added/overwritten by the plugin. Typically a 'model' key can be used to select different models if available.">i</span>
              </label>
              <span id="models-status" class="models-status push-right"></span>
              <button type="button" id="query-models-btn"
                title="Query the endpoint's available models (GET {base}/models)">
                Query available models
              </button>
            </div>
            <div id="models-list" class="model-list"></div>
            <textarea id="other_options" name="other option window"> </textarea>
          </div>
          <div class="form-group checkbox-row">
            <input type="checkbox" id="strip_think_tag" name="strip think tag" />
            <label for="strip_think_tag">
              Remove &lt;think&gt; tag and its content from the response
              <span class="info-icon" title="When enabled, any &lt;think&gt;...&lt;/think&gt; block produced by reasoning models will be stripped from the response before it is inserted into the composer.">i</span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <h2>Write</h2>
          <div class="form-group">
            <div class="label-with-action">
              <label for="llm_context">LLM Context:</label>
              <button type="button" id="reset-llm-context-btn" class="reset-btn" data-reset-prompt="llm_context" title="Reset to default" aria-label="Reset LLM context to default">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="1 4 1 10 7 10" />
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
              </button>
            </div>
            <textarea id="llm_context" name="llm context window"> </textarea>
          </div>
          <div class="form-group checkbox-row">
            <input type="checkbox" id="use_last_mails" name="use last mails" />
            <label for="use_last_mails">Use last few mails to same recipient as context</label>
            <input type="number" id="recent_mails_count" name="recent mails count" min="1" step="1"
              title="How many recent sent mails to the recipient to feed as writing-style context." />
          </div>
          <div class="form-group">
            <div class="label-with-action">
              <label for="subject_context">
                Subject Context:
                <span class="info-icon" title="System prompt used when generating a subject line. Your name and (optionally) recent mails are appended automatically.">i</span>
              </label>
              <button type="button" id="reset-subject-context-btn" class="reset-btn" data-reset-prompt="subject_context" title="Reset to default" aria-label="Reset subject context to default">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="1 4 1 10 7 10" />
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
              </button>
            </div>
            <textarea id="subject_context" name="subject context"> </textarea>
          </div>
          <div class="feature-endpoint-slot" data-feature="compose"></div>
        </div>

        <div class="settings-section advanced-only">
          <h2>Summarize</h2>
          <div class="form-group">
            <div class="label-with-action">
              <label for="summary_context">
                Summary system prompt:
                <span class="info-icon" title="System prompt used to summarise the conversation you reply to. The JSON answer format the summary popup needs is appended automatically.">i</span>
              </label>
              <button type="button" class="reset-btn" data-reset-prompt="summary_context" title="Reset to default" aria-label="Reset summary system prompt to default">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="1 4 1 10 7 10" />
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
              </button>
            </div>
            <textarea id="summary_context" name="summary context"> </textarea>
          </div>
          <div class="feature-endpoint-slot" data-feature="summarize"></div>
        </div>

        <div class="settings-section">
          <h2>Organise Folder</h2>

          <div class="form-group advanced-only">
            <div class="label-with-action">
              <label for="organise_system_prompt">
                Organise system prompt:
                <span class="info-icon" title="System prompt used to classify emails into the LLM folder rules. The JSON answer format the plugin parses is appended automatically.">i</span>
              </label>
              <button type="button" class="reset-btn" data-reset-prompt="organise_system_prompt" title="Reset to default" aria-label="Reset organise system prompt to default">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="1 4 1 10 7 10" />
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
              </button>
            </div>
            <textarea id="organise_system_prompt" name="organise system prompt"> </textarea>
          </div>

          <h3>
            Pre-filter rules
            <span class="info-icon" title="Deterministic rules applied to the folder before anything is sent to the LLM, so matched emails never reach the model — cheaper and predictable for newsletters, CI mail, and the like.&#10;&#10;A matching email is moved to the target folder; leave the target empty to keep it where it is. Rules are evaluated top to bottom and the first match wins.&#10;&#10;Thunderbird's own message filters cannot be triggered by an add-on — set those up separately under Tools ▸ Message Filters.">i</span>
          </h3>
          <div class="prefilter-rule-header">
            <span class="pf-field">Field</span>
            <span class="pf-operator">
              Operator
              <span class="info-icon" title="&quot;matches regex&quot; is case-insensitive and unanchored, so it already matches substrings: the pattern invoice matches &quot;Your invoice is ready&quot;.&#10;&#10;Anchor it when you mean the whole value: ^\[CI\] matches only subjects starting with [CI], and \.pdf$ only ones ending in .pdf.&#10;&#10;For a plain substring with no special characters, prefer &quot;contains&quot;.">i</span>
            </span>
            <span class="pf-value">Value</span>
            <span class="pf-target">Move to folder (optional)</span>
            <span class="pf-badge"></span><!-- badge column -->
            <span></span><!-- remove column -->
          </div>
          <div id="prefilter-rules-list"></div>
          <div class="inline-controls" style="margin-top:4px;">
            <button type="button" id="add-prefilter-rule-btn">+ Add Pre-filter</button>
          </div>

          <h3>
            LLM folder rules
            <span class="info-icon" title="Destination folders offered to the LLM, each with a description it uses to classify the remaining emails.">i</span>
          </h3>
          <div class="folder-rule-header">
            <span>Folder path</span>
            <span></span><!-- badge column -->
            <span>Description for the LLM</span>
          </div>
          <div id="folder-rules-list"></div>
          <div class="inline-controls" style="margin-top:4px;">
            <button type="button" id="add-folder-rule-btn">+ Add Rule</button>
            <span id="folder-paths-status" class="models-status push-right"></span>
            <button type="button" id="refresh-folder-paths-btn"
              title="Reload the folder list offered in the dropdowns (e.g. after creating a folder)">
              Reload folders
            </button>
          </div>
          <div class="form-group checkbox-row" style="margin-top:10px;">
            <input type="checkbox" id="confirm_moves" name="confirm moves before applying" />
            <label for="confirm_moves">
              Confirm moves before applying
              <span class="info-icon" title="When enabled, organising opens a window listing each email with a dropdown to choose its destination folder; nothing moves until you click OK. When disabled, emails are moved automatically in batches.">i</span>
            </label>
          </div>
          <div class="feature-endpoint-slot" data-feature="organise"></div>
        </div>

        <div class="settings-section">
          <h2>Reports</h2>
          <div class="form-group advanced-only">
            <div class="label-with-action">
              <label for="report_system_prompt">
                Report system prompt:
                <span class="info-icon" title="System prompt of the report agent. Keep the description of the search tools and of the [label](email:&lt;id&gt;) citation format, which the report window turns into links.">i</span>
              </label>
              <button type="button" class="reset-btn" data-reset-prompt="report_system_prompt" title="Reset to default" aria-label="Reset report system prompt to default">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="1 4 1 10 7 10" />
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
              </button>
            </div>
            <textarea id="report_system_prompt" name="report system prompt"> </textarea>
          </div>
          <div class="form-group form-row">
            <label for="report_default_days">Default days in the past:</label>
            <input type="number" id="report_default_days" name="report default days" min="1" step="1" />
          </div>
          <div class="form-group form-row">
            <label for="report_max_search_results">
              Max search results per query:
              <span class="info-icon" title="Upper bound on messages returned by a single search_messages tool call. Lower values reduce token usage.">i</span>
            </label>
            <input type="number" id="report_max_search_results" name="report max search results" min="1" step="1" />
          </div>
          <div class="form-group form-row">
            <label for="report_max_steps">
              Max agentic steps:
              <span class="info-icon" title="Upper bound on tool-calling iterations per report. Bounds cost; raise it for more complex reports.">i</span>
            </label>
            <input type="number" id="report_max_steps" name="report max steps" min="1" step="1" />
          </div>
          <div class="form-group form-row">
            <label for="report_max_message_bodies">
              Max message bodies per report:
              <span class="info-icon" title="Upper bound on how many full email bodies a single report may read (via get_messages). Bodies are always read in full; this caps how many.">i</span>
            </label>
            <input type="number" id="report_max_message_bodies" name="report max message bodies" min="1" step="1" />
          </div>
          <div class="form-group form-row">
            <label for="report_max_total_body_chars">
              Max total body characters per report:
              <span class="info-icon" title="Run-level ceiling on the combined characters of all bodies read in one report. Once reached, no further bodies are served. The main knob for keeping token use predictable.">i</span>
            </label>
            <input type="number" id="report_max_total_body_chars" name="report max total body chars" min="1" step="1" />
          </div>
          <div class="form-group checkbox-row">
            <input type="checkbox" id="report_disable_thinking" name="report disable thinking" />
            <label for="report_disable_thinking">
              Disable model thinking for reports
              <span class="info-icon" title="Sends chat_template_kwargs.enable_thinking=false with every report request, which makes reasoning models such as Qwen3 (served by vLLM/SGLang) answer faster with fewer tokens. Applies to all report steps, including the final report. Leave off if your endpoint rejects unknown parameters.">i</span>
            </label>
          </div>
          <div class="feature-endpoint-slot" data-feature="report"></div>
        </div>

      </form>
    </div>
    <!-- Per-feature endpoint block, cloned by options.ts into every .feature-endpoint-slot (advanced mode only). -->
    <template id="feature-endpoint-template">
      <div class="feature-endpoint advanced-only">
        <div class="form-group checkbox-row">
          <input type="checkbox" class="fe-enabled" id="fe-enabled" />
          <label for="fe-enabled">
            Use a separate endpoint
            <span class="info-icon" title="When off, this feature uses the endpoint and options of the API section. When first enabled, the fields start as a copy of the API section.">i</span>
          </label>
        </div>
        <div class="fe-fields">
          <div class="form-group form-row">
            <div class="url-label-group">
              <label for="fe-url">URL:</label>
              <button type="button" class="fe-grant-btn push-right">Grant access</button>
              <span class="fe-permission-status folder-path-badge"></span>
            </div>
            <input type="text" class="fe-url" id="fe-url" placeholder="https://your-llm.example.com/v1" />
          </div>
          <div class="fe-url-hint models-status url-hint"></div>
          <div class="form-group form-row">
            <label for="fe-token">Api token:</label>
            <div class="input-with-toggle">
              <input type="password" class="fe-token" id="fe-token" autocomplete="off" spellcheck="false" />
              <button type="button" class="fe-toggle-token-btn input-toggle-btn" title="Show token" aria-label="Show token" aria-pressed="false">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>
          <div class="form-group form-row">
            <label for="fe-timeout">Request timeout (seconds):</label>
            <input type="number" class="fe-timeout" id="fe-timeout" min="0" step="1" placeholder="No timeout" />
          </div>
          <div class="form-group">
            <div class="other-options-header">
              <label for="fe-other-options">Other options (json):</label>
              <span class="fe-models-status models-status push-right"></span>
              <button type="button" class="fe-query-models-btn" title="Query the endpoint's available models (GET {base}/models)">
                Query available models
              </button>
            </div>
            <div class="fe-models-list model-list"></div>
            <textarea class="fe-other-options" id="fe-other-options"></textarea>
          </div>
        </div>
      </div>
    </template>
    <!--suppress HtmlUnknownTarget generated from ../src/options.ts-->
    <script src="../options.js"></script>
  </body>
</html>
