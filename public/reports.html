<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Report</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 16px;
        color: #222;
        box-sizing: border-box;
        /* Column layout so the report field can grow into the space left at the bottom. */
        display: flex;
        flex-direction: column;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      /* Checkbox and day-count share a single row (Copilot-style compact controls). */
      .controls-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 16px;
        font-size: 13px;
      }
      .control-inline {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .controls-row input[type="number"] {
        width: 56px;
        box-sizing: border-box;
        padding: 4px 6px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: inherit;
        font-size: 13px;
      }
      .scope-note {
        font-size: 12px;
        color: #666;
        margin: 4px 0 0;
      }
      /* Row for saving/loading reusable report prompts. */
      .saved-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 10px 0 0;
        font-size: 13px;
      }
      .saved-row select,
      .saved-row input[type="text"] {
        box-sizing: border-box;
        padding: 4px 6px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: inherit;
        font-size: 13px;
      }
      #saved-prompts {
        flex: 1 1 40%;
        min-width: 0;
      }
      #prompt-name {
        flex: 1 1 60%;
        min-width: 0;
      }
      .saved-row .text-btn {
        flex: 0 0 auto;
      }
      /* Prompt field with the send/stop icon docked in its bottom-right corner. */
      .prompt-box {
        position: relative;
        margin: 12px 0 4px;
      }
      #prompt {
        width: 100%;
        box-sizing: border-box;
        height: 90px;
        padding: 8px 44px 8px 8px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: inherit;
        font-size: 13px;
        resize: vertical;
      }
      #prompt:focus {
        outline: none;
        border-color: #0a84ff;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        background: transparent;
        color: #555;
        cursor: pointer;
        border-radius: 6px;
      }
      .icon-btn:hover {
        background: #e9e9ed;
        color: #1f1f1f;
      }
      .icon-btn:focus-visible {
        outline: 2px solid #0a84ff;
        outline-offset: 1px;
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
        display: block;
      }
      #create-btn {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 32px;
        height: 32px;
        background: #0a84ff;
        color: #fff;
      }
      #create-btn:hover {
        background: #0060df;
        color: #fff;
      }
      /* Toggle between the send and stop glyphs depending on generation state. */
      #create-btn .icon-stop {
        display: none;
      }
      #create-btn.busy .icon-send {
        display: none;
      }
      #create-btn.busy .icon-stop {
        display: block;
      }
      .output-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .output-header h2 {
        font-size: 15px;
        margin: 0;
      }
      .output-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #copy-btn {
        width: 28px;
        height: 28px;
      }
      .text-btn {
        width: auto;
        height: 28px;
        padding: 0 8px;
        font-size: 12px;
        font-family: inherit;
      }
      #report-output {
        width: 100%;
        box-sizing: border-box;
        /* Fill the remaining vertical space at the bottom of the popup. */
        flex: 1 1 auto;
        min-height: 120px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f8f8f8;
        font-family: inherit;
        font-size: 13px;
        white-space: pre-wrap;
        overflow-y: auto;
        resize: none;
      }
      #status {
        font-size: 13px;
        color: #555;
        min-height: 18px;
        margin: 4px 0 4px;
      }
      /* Live progress row: spinner + counters/phase, with a docked Stop button. */
      .progress {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #555;
        margin: 0 0 12px;
      }
      /* .progress sets display:flex, which overrides the [hidden] default — re-hide explicitly. */
      .progress[hidden] {
        display: none;
      }
      .spinner {
        height: 16px;
        flex: 0 0 auto;
      }
      #progress-text {
        flex: 1 1 auto;
      }
      .abort-btn {
        flex: 0 0 auto;
        border: 1px solid #e0b4b4;
        color: #b00020;
      }
      .abort-btn:hover {
        background: #fbe9e9;
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>Create Report</h1>

    <div class="controls-row">
      <label class="control-inline">
        <input type="checkbox" id="folder-only" checked />
        Search in this folder only
      </label>
      <span class="control-inline">
        Last
        <input type="number" id="days" min="1" step="1" value="30" aria-label="Number of days in the past to search" />
        days
      </span>
    </div>
    <p class="scope-note" id="scope-note"></p>

    <div class="saved-row">
      <select id="saved-prompts" aria-label="Load a saved prompt">
        <option value="">Saved prompts…</option>
      </select>
      <input type="text" id="prompt-name" placeholder="Name to save as" aria-label="Prompt name" />
      <button type="button" id="save-prompt-btn" class="icon-btn text-btn">Save</button>
      <button type="button" id="delete-prompt-btn" class="icon-btn text-btn" disabled>Delete</button>
    </div>

    <div class="prompt-box">
      <textarea
        id="prompt"
        aria-label="Report request"
        placeholder="e.g. A to-do list of open items addressed to me, or how long Alice took to reply over the last 120 days."
      ></textarea>
      <button type="button" id="create-btn" title="Create report" aria-label="Create report" class="icon-btn">
        <!-- Paper-plane send glyph shown while idle -->
        <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13" />
          <path d="M22 2 15 22l-4-9-9-4 20-7z" />
        </svg>
        <!-- Stop glyph shown while generating -->
        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="2" />
        </svg>
      </button>
    </div>

    <p id="status">Ready.</p>
    <div id="progress" class="progress" hidden>
      <img class="spinner" src="../icons/loader-32px.gif" alt="" />
      <span id="progress-text">Starting…</span>
      <button type="button" id="abort-btn" class="icon-btn text-btn abort-btn" title="Stop generating" aria-label="Stop generating">Stop</button>
    </div>

    <div class="output-header">
      <h2 id="report-heading">Report</h2>
      <div class="output-actions">
        <button type="button" id="save-txt-btn" title="Save report as .txt" aria-label="Save report as .txt" class="icon-btn text-btn">.txt</button>
        <button type="button" id="save-md-btn" title="Save report as .md" aria-label="Save report as .md" class="icon-btn text-btn">.md</button>
        <button type="button" id="copy-btn" title="Copy report" aria-label="Copy report" class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        </button>
      </div>
    </div>
    <textarea id="report-output" readonly aria-labelledby="report-heading" placeholder="The generated report will appear here."></textarea>

    <script src="../reports.js"></script>
  </body>
</html>
